<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>App retirada</title>
<style>
  :root { --fondo:#f6f7f9; --texto:#1d2330; --suave:#5b6474; --tarjeta:#ffffff; --borde:#dfe3ea; }
  @media (prefers-color-scheme: dark) { :root { --fondo:#12151b; --texto:#e8ebf1; --suave:#9aa3b2; --tarjeta:#1b2029; --borde:#2b3240; } }
  html, body { margin:0; background:var(--fondo); color:var(--texto); font:16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width:30rem; margin:12vh auto 0; padding:0 16px; }
  .tarjeta { background:var(--tarjeta); border:1px solid var(--borde); border-radius:14px; padding:22px 20px; }
  h1 { font-size:1.25rem; margin:0 0 .5rem; }
  p { margin:.4rem 0; color:var(--suave); }
  #estado { color:var(--texto); }
</style>
</head>
<body>
<main>
  <div class="tarjeta">
    <h1>Esta app fue retirada</h1>
    <p>Su dueño la retiró y sus datos ya no están aquí.</p>
    <p id="estado">Borrando las copias guardadas en este dispositivo…</p>
    <p>Si la tenías en la pantalla de inicio, ya puedes eliminar el ícono.</p>
  </div>
</main>
<script>
// Borra lo que la app había guardado en este dispositivo (solo lo suyo: "mjdm_*" y los filtros "mb_filtros*",
// las copias "mjdm-*" y su service worker), sin tocar otras páginas del mismo sitio.
(async function(){
  var hecho = true;
  try { for (var i = localStorage.length - 1; i >= 0; i--){ var k = localStorage.key(i); if (k && (k.indexOf('mjdm') === 0 || k.indexOf('mb_filtros') === 0)) localStorage.removeItem(k); } } catch(e){ hecho = false; }
  try { if (window.caches){ var ks = await caches.keys(); await Promise.all(ks.filter(function(k){ return k.indexOf('mjdm') === 0; }).map(function(k){ return caches.delete(k); })); } } catch(e){ hecho = false; }
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations){
      var rs = await navigator.serviceWorker.getRegistrations();
      var aqui = location.href.replace(/[#?].*$/, '').replace(/[^\/]*$/, '');
      await Promise.all(rs.filter(function(r){ return r.scope.indexOf(aqui) === 0; }).map(function(r){ return r.unregister(); }));
    }
  } catch(e){ hecho = false; }
  try { if (location.hash) history.replaceState(null, '', location.pathname); } catch(e){}
  document.getElementById('estado').textContent = hecho ? 'Listo: este dispositivo ya no guarda datos de la app.' : 'Se borró lo que se pudo; si quedó algo, borra los datos del sitio en el navegador.';
})();
</script>
</body>
</html>
